<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Diagram Maker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Science Diagram Maker</h1>
  <p class="sub">Model: {{ model }}. Saved results load without any API call. Decisions are saved in this browser (localStorage).</p>
  <div id="message" class="message" hidden></div>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>Concept</th><th>Diagram</th><th>Checks</th><th>Cost and retries</th><th>Review</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <!-- tojson makes the data safe inside a script tag -->
  <script id="data" type="application/json">{{ results|tojson }}</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
